name: Relay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  endpoints:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - if: runner.os != 'macOS'
        run: python -B tests/service_smoke.py
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            python3 -B tests/service_smoke.py
          else
            echo "No GUI login domain on this runner; command-line endpoint tests ran."
          fi
  two-tunnels:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution OpenSSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server
      - name: Deploy, transfer in both directions, reconnect, revoke and uninstall
        run: sudo env DRIVE_RELAY_DISPOSABLE=1 python3 -B tests/integration_linux.py
